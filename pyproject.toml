[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auralis-vision"
version = "0.1.0"
description = "AURALIS VISION - Enterprise Image Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0",
    "PyJWT>=2.8,<3.0",
    "minio>=7.2,<8.0",
    "boto3>=1.34,<2.0",
    "opensearch-py>=2.4,<3.0",
]
[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "hypothesis>=6.100,<7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
