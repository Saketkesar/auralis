# Alembic configuration for AURALIS VISION.
#
# The database URL is intentionally NOT set here. The environment script
# (migrations/env.py) resolves it from application configuration / the
# DATABASE_URL environment variable so secrets never live in source
# (Requirement 25.5) and migrations share the runtime database URL
# (Requirement 26.1).

[alembic]
# Path to migration scripts, relative to this file.
script_location = migrations

# Template used to generate migration file names; a date prefix keeps the
# version history readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use os.pathsep-separated paths; project root so "app" is importable.
prepend_sys_path = .

# Timezone for file_template timestamps.
timezone = UTC

[post_write_hooks]
# No post-write hooks configured.

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
