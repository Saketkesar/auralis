# AURALIS VISION — Nginx edge configuration.
#
# Responsibilities (per design Security & Deployment architecture):
#   - TLS termination (HTTPS), redirecting all plaintext traffic to HTTPS.
#   - Reverse proxy to the stateless Flask web tier (Gunicorn on :8000).
#   - Content Security Policy on every response (Requirement 25.1).
#   - Edge per-client rate limiting (Requirement 25.3).
#
# Certificates are mounted read-only at /etc/nginx/certs (see docker-compose.yml).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Allow large image uploads; keep in step with MAX_FILE_SIZE_BYTES (50 MiB).
    client_max_body_size 50m;

    # ----- Edge rate limiting (25.3) ---------------------------------------
    # Per-client-IP zones. Exceeding the rate returns 429 until the window
    # drains; bursts are smoothed with nodelay.
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m   rate=10r/s;
    limit_req_zone  $binary_remote_addr  zone=login_limit:10m rate=5r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # Upstream Flask/Gunicorn web tier.
    upstream auralis_web {
        server web:8000;
        keepalive 32;
    }

    # ----- HTTP -> HTTPS redirect ------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Plain-HTTP health probe for container orchestration.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----- HTTPS: TLS termination + reverse proxy --------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # TLS termination (24/25). Certificates mounted from ./nginx/certs.
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ----- Security headers, incl. CSP on every response (25.1) --------
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Cap concurrent connections per client.
        limit_conn conn_limit 20;

        # Common proxy headers preserved for the app's auth/audit layer.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;

        # Stricter edge limit on the authentication endpoint.
        location = /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://auralis_web;
        }

        # General API + UI traffic.
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auralis_web;
        }

        # Static assets served by the app tier.
        location /static/ {
            proxy_pass http://auralis_web;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
